name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  typecheck:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # `nuxi prepare` first (the typecheck script does it) — vue-tsc needs the
      # generated .nuxt/ types for auto-imports, component props and route
      # names, and without them every auto-imported symbol reports as missing.
      #
      # This gate exists because TypeScript is the only thing checking the web
      # side of an API contract. The Go API has cmd/sqlcheck for its SQL, and
      # api#189 showed what happens without an equivalent: a query kept
      # selecting a column a migration had dropped and two endpoints returned
      # 500 in production for weeks. The client half of that same class —
      # reading a field the API stopped sending, or a component prop that was
      # renamed — surfaces here and nowhere else.
      #
      # Zero errors as of web#415. Keep it at zero: this is only useful as a
      # gate while it is clean, and a burn-down that was allowed to regrow
      # would just be noise everyone learns to ignore.
      - name: Typecheck
        run: npm run typecheck

      # Catches what vue-tsc cannot: template compilation, unresolved imports
      # at bundle time, and Nitro/prerender failures. Netlify runs this too,
      # but only after merge for the production deploy.
      - name: Build
        run: npm run generate
